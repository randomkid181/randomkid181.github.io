<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Portfolio Dashboard</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b1020;
      color: #edf2ff;
    } 
    .sidebar {
      width: 220px;
      background: #111a30;
      padding: 25px 18px;
      min-height: 100vh;
    }
    .layout { display: flex; }
    .logo { font-size: 20px; font-weight: bold; margin-bottom: 35px; }
    .logo span { color: #829cff; }
    button {
      cursor: pointer;
      border: 0;
      border-radius: 8px;
      padding: 12px;
      font-weight: bold;
    }
    .nav {
      display: block;
      width: 100%;
      text-align: left;
      background: transparent;
      color: #aebbd8;
      margin-bottom: 8px;
    }
